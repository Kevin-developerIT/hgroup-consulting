<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO tags stay one per line: scripts/prerender.js rewrites them
         per route from src/data/seo.js. Values here are the home's. -->
    <title>H Group | Agencia Creativa, PR & Influencer Marketing México</title>
    <meta name="description" content="H Group conecta marcas con audiencias a través de PR, influencer marketing, experiencias, producción y estrategia creativa en México y LATAM." />
    <link rel="canonical" href="https://hgroup.consulting/" />
    <link rel="icon" type="image/x-icon" href="/Hlogo_negro.ico" />

    <meta name="theme-color" content="#0d0d0d" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph — WhatsApp, Facebook, LinkedIn previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="H Group" />
    <meta property="og:title" content="H Group | Agencia Creativa, PR & Influencer Marketing México" />
    <meta property="og:description" content="H Group conecta marcas con audiencias a través de PR, influencer marketing, experiencias, producción y estrategia creativa en México y LATAM." />
    <meta property="og:url" content="https://hgroup.consulting/" />
    <meta property="og:image" content="https://hgroup.consulting/Hlogo_negro.png" />
    <meta property="og:image:alt" content="H Group" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="H Group | Agencia Creativa, PR & Influencer Marketing México" />
    <meta name="twitter:description" content="H Group conecta marcas con audiencias a través de PR, influencer marketing, experiencias, producción y estrategia creativa en México y LATAM." />
    <meta name="twitter:image" content="https://hgroup.consulting/Hlogo_negro.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
